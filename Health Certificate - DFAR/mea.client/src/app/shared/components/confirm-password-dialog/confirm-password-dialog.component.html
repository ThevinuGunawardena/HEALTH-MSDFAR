<p-dialog header="Confirm Signatory" [(visible)]="visible" [modal]="true" [closable]="false" [style]="{ width: '400px' }" (onHide)="cancel()">
    <div class="flex flex-col gap-4 py-4">
        <p>Please enter the password for the selected user to confirm.</p>
        <div class="flex flex-col gap-2">
            <!-- <label for="signatoryPassword">Password</label> -->
            <p-password id="signatoryPassword" [formControl]="confirmPasswordControl" styleClass="w-full" inputStyleClass="w-full" [toggleMask]="true" [feedback]="false" (keyup.enter)="confirm()" placeholder="Password"></p-password>
        </div>
    </div>
    <ng-template pTemplate="footer">
        <p-button label="Cancel" icon="pi pi-times" [outlined]="true" severity="secondary" (onClick)="cancel()"></p-button>
        <p-button label="Confirm" icon="pi pi-check" (onClick)="confirm()"></p-button>
    </ng-template>
</p-dialog>
